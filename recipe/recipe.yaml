schema_version: 1

context:
  name: pyiron_base
  version: "0.15.20"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyiron_base-${{ version }}.tar.gz
  sha256: 0340e0e54d644ad138ef5902708bcd3b6a874a8c8a50213b34a95724661c8ea2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyiron=pyiron_base.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - cloudpickle
    - gitpython
    - h5io_browser
    - h5py
    - jinja2
    - monty
    - numpy
    - pandas
    - pint
    - psutil
    - pyfileindex
    - pysqa
    - sqlalchemy
    - pytables
    - tqdm
    - traitlets
    - pyiron_dataclasses
    - pyiron_snippets
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }},<3.14
    - cloudpickle >=2.2.1,<=3.1.2
    - executorlib >=0.1.0,<=1.10.3
    - h5io_browser >=0.0.14,<=0.2.18
    - h5py >=3.11.0,<=3.16.0
    - numpy >=1.26.0,<=2.5.3
    - monty >=2025.1.3,<=2026.2.18
    - pandas >=2.0.0,<=3.0.6
    - psutil >=5.9.3,<=7.2.2
    - pyfileindex >=0.2.0,<=0.2.3
    - pyiron_dataclasses >=0.0.4,<=0.0.14
    - pyiron_snippets >=1.0.1,<=1.5.0
    - pysqa >=0.1.12,<=1.0.1
    - sqlalchemy >=2.0.22,<=2.0.54
    - pytables ==3.11.1
    - tqdm >=4.44.0,<=4.70.1
    - traitlets >=5.1.1,<=5.16.1
tests:
  - python:
      imports:
        - pyiron_base
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pyiron --help

about:
  summary: pyiron_base - an integrated development environment (IDE) for computational science.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyiron_base

extra:
  recipe-maintainers:
    - niklassiemer
    - srmnitc
    - pyiron-runner
    - jan-janssen
    - pmrv
